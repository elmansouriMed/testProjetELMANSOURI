openapi: 3.1.0
info:
  title: Payment Message Hub
  version: 1.0.0
  description: Consultation des archives IBM MQ. Aucune authentification applicative.
servers:
  - url: http://localhost:8080
paths:
  /api/messages:
    get:
      operationId: listMessages
      summary: Métadonnées paginées, ID décroissant, sans le contenu
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [STORED, QUARANTINED]}
        - name: source
          in: query
          description: Application source exacte, sensible à la casse.
          schema: {type: string, maxLength: 128}
        - name: correlationId
          in: query
          description: Identifiant de corrélation exact.
          schema: {type: string, maxLength: 512}
        - name: mqMessageId
          in: query
          description: Identifiant MQ exact.
          schema: {type: string, maxLength: 512}
        - name: from
          in: query
          description: Date de réception minimale incluse, ISO 8601 avec fuseau.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Date de réception maximale exclue. Doit être postérieure à from.
          schema: {type: string, format: date-time}
        - name: beforeId
          in: query
          description: Valeur nextCursor de la page précédente, entier 64 bits positif.
          schema: {type: integer, format: int64, minimum: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Page de métadonnées ; aucun total global calculé.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, hasMore]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: {$ref: '#/components/schemas/MessageSummary'}
                  nextCursor:
                    type: [string, 'null']
                    description: ID du dernier élément si une autre page existe, sinon null.
                    pattern: '^[0-9]+$'
                  hasMore: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/messages/{id}:
    get:
      operationId: getMessage
      summary: Métadonnées et corps d’un message archivé
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Corps texte UTF-8 ou binaire Base64 ; les deux sont null pour un rejet.
          content:
            application/json:
              schema:
                type: object
                required: [metadata, textPayload, base64Payload]
                properties:
                  metadata: {$ref: '#/components/schemas/MessageSummary'}
                  textPayload: {type: [string, 'null']}
                  base64Payload: {type: [string, 'null'], contentEncoding: base64}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404':
          description: Aucun message pour cet identifiant.
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  responses:
    BadRequest:
      description: Filtre, date, identifiant ou taille de page invalide.
    Unavailable:
      description: Stockage temporairement indisponible.
      headers:
        Retry-After:
          schema: {type: string, example: '5'}
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title: {type: string}
              detail: {type: string}
              status: {type: integer, example: 503}
  schemas:
    MessageSummary:
      type: object
      required: [id, mqMessageId, correlationId, sourceApplication, sourceQueue, sentAt, receivedAt, bodyType, payloadSize, redelivered, status, rejectionReason]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          description: Entier SQL transmis en chaîne afin de préserver la précision JavaScript.
        mqMessageId: {type: string}
        correlationId: {type: [string, 'null']}
        sourceApplication: {type: string, maxLength: 128}
        sourceQueue: {type: string}
        sentAt: {type: [string, 'null'], format: date-time}
        receivedAt: {type: string, format: date-time}
        bodyType: {type: string, enum: [TEXT, BYTES, UNSUPPORTED]}
        payloadSize:
          type: integer
          format: int64
          minimum: 0
          description: Taille UTF-8 du texte ou taille binaire. Zéro si type non pris en charge.
        redelivered:
          type: boolean
          description: Indicateur MQ observé lors du premier archivage réussi.
        status: {type: string, enum: [STORED, QUARANTINED]}
        rejectionReason: {type: [string, 'null']}
