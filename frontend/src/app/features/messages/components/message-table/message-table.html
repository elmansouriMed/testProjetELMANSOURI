<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Identifiant MQ / Corrélation</th>
        <th>Application</th>
        <th>Réception</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody>
      @for (message of messages(); track message.id) {
        <tr>
          <td class="identifiers">
            <button
              class="message-link"
              (click)="messageSelected.emit(message)"
              [title]="message.mqMessageId"
            >
              {{ message.mqMessageId }}</button
            ><small [title]="message.correlationId ?? ''">{{
              message.correlationId || 'Sans corrélation'
            }}</small>
          </td>
          <td class="source-label">{{ message.sourceApplication }}</td>
          <td>
            {{ message.receivedAt | date: 'dd/MM/yyyy'
            }}<small>{{ message.receivedAt | date: 'HH:mm:ss' }}</small>
          </td>
          <td>
            <app-message-status [status]="message.status" />
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
