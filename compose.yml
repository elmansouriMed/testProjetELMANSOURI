name: payment-message-hub
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Exécutez scripts/init-dev.ps1 ou scripts/init-dev.sh}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  mq:
    image: icr.io/ibm-messaging/mq:9.4.5.1-r1
    environment:
      LICENSE: ${MQ_LICENSE:?Renseignez MQ_LICENSE=accept dans .env après lecture de la licence IBM}
      MQ_QMGR_NAME: QM1
      MQ_ENABLE_EMBEDDED_WEB_SERVER: "false"
    secrets: [mqAppPassword]
    ports: ["127.0.0.1:1414:1414"]
    volumes:
      - mq-data:/mnt/mqm
      - ./docker/mq/20-payments.mqsc:/etc/mqm/20-payments.mqsc:ro
    healthcheck:
      test: ["CMD", "chkmqhealthy"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_PASSWORD: ${DB_PASSWORD}
      MQ_HOST: mq
      MQ_PASSWORD: ${MQ_PASSWORD:?Exécutez le script init-dev}
      MQ_CONSUMERS: ${MQ_CONSUMERS:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-16}
      MQ_ENABLED: ${MQ_ENABLED:-true}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      mq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:4200:8080"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres-data:
  mq-data:
secrets:
  mqAppPassword:
    file: ./.secrets/mq-app-password.txt
